# tmux — zen: invisible scrollback/copy-mode layer
# Applied to ~/.config/tmux/tmux.conf
# Chrome-free: status off; borders drawn as blank cells (pane-border-lines
# "none" is post-3.7c master-only — spaces = invisible, keeps 1-cell gap
# between panes and lets the active-pane arrow render)

# --- chrome ---
set -g status off
set -g pane-border-lines none
set -g pane-border-indicators arrows
set -g pane-border-style "fg=#1a1b26"
set -g pane-active-border-style "fg=#7aa2f7"   # colours the active-pane arrow
# prefix t: toggle status line for a peek (no value = toggle, per man tmux)
bind t set status \; display "status toggled"

# --- copy-mode highlight + prompts (transient — only visible while used) ---
set -g mode-style "bg=#3b4261,fg=#c0caf5"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"

# --- base ---
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:RGB"
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g mouse off

# --- vi copy mode ---
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
# prefix r: incremental search up through scrollback (replaces refresh-client)
bind r copy-mode \; command-prompt -i -p "(search up)" \
    "send -X search-backward-incremental '%%%'"

# --- splits ---
# prefix v: side-by-side split (vertical divider, like vim :vsplit)
bind v split-window -h

# --- smart pane navigation (christoomey/vim-tmux-navigator) ---
# C-hjkl switches panes without prefix; passes through to nvim when a vim
# split edge is hit (plugin's nvim side maps the same keys)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# bare C-l is pane navigation now; prefix C-l restores clear screen
bind C-l send-keys 'C-l'
