# tmux — TokyoNight Night, vi copy mode, vim-aware pane navigation
# Applied to ~/.config/tmux/tmux.conf

# --- TokyoNight Night theme (hardcoded, matches Ghostty/NvChad/bat/Hyprland) ---
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[fg=#7aa2f7,bold] #S #[fg=#565f89]| "
set -g status-left-length 40
set -g status-right "#[fg=#565f89]%a %d %b #[fg=#c0caf5]%H:%M "
set -g status-right-length 50

set -g window-status-format "#[fg=#565f89] #I #W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I #W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#e0af68"
set -g window-status-bell-style "fg=#f7768e"

# --- pane borders — match hyprland appearance.lua ---
# active: gradient rgb(3b4261)->rgb(7aa2f7) is not possible in tmux; use accent blue
# inactive: rgb(1a1b26) (TokyoNight bg)
set -g pane-border-style "fg=#1a1b26"
set -g pane-active-border-style "fg=#7aa2f7"

# copy-mode highlight + command prompt
set -g mode-style "bg=#3b4261,fg=#c0caf5"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"

# --- base ---
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:RGB"
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set -g focus-events on
set -g mouse off

# --- vi copy mode ---
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# --- splits ---
# prefix v: side-by-side split (vertical divider, like vim :vsplit)
bind v split-window -h

# --- smart pane navigation (christoomey/vim-tmux-navigator) ---
# C-hjkl switches panes without prefix; passes through to nvim when a vim
# split edge is hit (plugin's nvim side maps the same keys)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# bare C-l is pane navigation now; prefix C-l restores clear screen
bind C-l send-keys 'C-l'
